{% extends 'extends_index_base.html' %}


{% block title %} 登录 {% endblock %}

{% block head %}
{{ block.super }}
<link rel="stylesheet" href="{% static 'css/auth_page/auth_login.css' %}">
{% endblock %}

{% block main %}
{{ block.super }}
<div class="login-container">
    <h2 class="login-title">用户登录</h2>
    <form method="post" action="{% url 'novel_auth:reverse_novel_login' %}">
        {% csrf_token %}
        <div class="form-group">
            <label for="username">用户名：</label>
            <input type="text" id="username" name="username_email" required class="form-control" placeholder="请输入用户名或邮箱">
        </div>
        <div class="form-group">
            <label for="password">密码：</label>
            <input type="password" id="password" name="password" required class="form-control" placeholder="请输入密码">
        </div>
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" name="remember_pwd" value="1" id="checkDefault" checked>
            <label class="form-check-label" for="checkDefault">记住密码</label>
        </div>
        {% if error_message %}
        <div class="alert alert-danger">
            {{ error_message }}
        </div>
        <p>忘记密码？<a href="{% url 'novel_auth:reverse_novel_reset_pwd' %}">重置密码</a></p>
        {% endif %}
        <button type="submit" class="btn btn-primary">登录</button>
    </form>
    <p>还没有账号？<a href="{% url 'novel_auth:reverse_novel_register' %}">注册</a></p>
</div>
{% endblock %}

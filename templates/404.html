{% extends 'index_base.html' %}

{% block title %} 404 {% endblock %}

{% block head %}
<link rel="stylesheet" href="{% static 'css/404.css' %}">
{% endblock %}

{% block main %}
<div class="error-container error-container-404">
    <h1 class="error-title error-title-404">
        404</h1>
    <h2 class="error-subtitle error-subtitle-404">页面未找到</h2>
    <p class="error-message error-message-404">
        很抱歉，您访问的页面不存在或已被移除。<br>
        请检查您输入的网址是否正确，或返回首页继续浏览。
    </p>
    <a href="{% url 'index' %}" class="error-home-btn error-home-btn-404">
        返回首页
    </a>
</div>
{% endblock %}
